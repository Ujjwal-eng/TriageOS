services:
  - type: web
    name: triageos
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: GROQ_API_KEY
        sync: false          # entered in Render dashboard, not stored in repo
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: TriageOS
