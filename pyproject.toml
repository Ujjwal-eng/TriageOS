[project]
name = "triageos"
version = "0.1.0"
description = "A production-shaped customer support system that triages, resolves, and escalates real tickets using a team of specialized AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "groq>=0.37.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.8",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph>=1.2.9",
    "langsmith>=0.10.6",
    "mcp>=1.28.1",
    "presidio-analyzer>=2.2.363",
    "presidio-anonymizer>=2.2.363",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.51.0",
]
